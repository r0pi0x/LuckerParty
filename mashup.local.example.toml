# Copy to mashup.local.toml (gitignored) and edit. Machine-specific settings
# that must never be committed: install paths, and later Combat Arms keys.

[games.cs_source]
# Folder containing cstrike/ and hl2/. Steam app 240.
path = "~/games/counter-strike-source"

[games.combat_arms]
# Folder containing Game/*.rez. Steam app 1263550 (Combat Arms: the Classic).
path = "~/games/combat-arms-classic"

# Combat Arms payload keys, by the scheme named in each archive's header
# title (V1 -> V1, V2 -> V2). the archive cipher key as
# 64 hex characters, IV as 32 hex characters (specs/combat_arms/rez_archive.md).
# Without a key, those archives still list their files but don't extract.
# [games.combat_arms.keys.V1]
# key = "<64 hex characters>"
# iv = "<32 hex characters>"
