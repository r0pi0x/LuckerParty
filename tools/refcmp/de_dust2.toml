# Camera views compared between real CS:S and mashup (cargo run --bin refcmp).
# Positions are eye positions in Source units; angles are [pitch, yaw] in
# Source degrees (yaw 0 = +X, positive pitch looks down).

map = "de_dust2"
# A point_viewcontrol in the map that refcmp repositions for each view.
camera = "cam1"

[[view]]
name = "a_sign_e"
position = [-295.3, 1078.7, 86.6]
angles = [0, 0]

[[view]]
name = "a_sign_n"
position = [-295.3, 1078.7, 86.6]
angles = [0, 90]

[[view]]
name = "a_sign_w"
position = [-295.3, 1078.7, 86.6]
angles = [0, 180]

[[view]]
name = "a_sign_s"
position = [-295.3, 1078.7, 86.6]
angles = [0, 270]

# Sky orientation checks (Source pitch < 0 looks up).
[[view]]
name = "sky_e"
position = [-295.3, 1078.7, 86.6]
angles = [-30, 0]

[[view]]
name = "sky_n"
position = [-295.3, 1078.7, 86.6]
angles = [-30, 90]

[[view]]
name = "sky_w"
position = [-295.3, 1078.7, 86.6]
angles = [-30, 180]

[[view]]
name = "sky_s"
position = [-295.3, 1078.7, 86.6]
angles = [-30, 270]

[[view]]
name = "sky_up"
position = [-295.3, 1078.7, 86.6]
angles = [-85, 0]

# Floor overlays on displacement terrain (dirt marks).
[[view]]
name = "floor_ct"
position = [-421.0, 2050.0, 60.0]
angles = [55, 90]

[[view]]
name = "floor_mid"
position = [-416.0, 1110.0, 40.0]
angles = [55, 90]

# Crates with detail textures (de_dust/dumltrycrsd2), B site.
[[view]]
name = "crates_b"
position = [-1100.0, 2234.0, 90.0]
angles = [10, 180]
