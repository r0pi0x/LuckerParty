# Camera views compared between real CS:S and mashup (cargo run --bin refcmp).
# Positions are eye positions in Source units; angles are [pitch, yaw] in
# Source degrees (yaw 0 = +X, positive pitch looks down).

map = "de_dust2"
# A point_viewcontrol in the map that refcmp repositions for each view.
camera = "cam1"

[[view]]
name = "a_sign_e"
position = [-295.3, 1078.7, 86.6]
angles = [0, 0]

[[view]]
name = "a_sign_n"
position = [-295.3, 1078.7, 86.6]
angles = [0, 90]

[[view]]
name = "a_sign_w"
position = [-295.3, 1078.7, 86.6]
angles = [0, 180]

[[view]]
name = "a_sign_s"
position = [-295.3, 1078.7, 86.6]
angles = [0, 270]

# Sky orientation checks (Source pitch < 0 looks up).
[[view]]
name = "sky_e"
position = [-295.3, 1078.7, 86.6]
angles = [-30, 0]

[[view]]
name = "sky_n"
position = [-295.3, 1078.7, 86.6]
angles = [-30, 90]

[[view]]
name = "sky_w"
position = [-295.3, 1078.7, 86.6]
angles = [-30, 180]

[[view]]
name = "sky_s"
position = [-295.3, 1078.7, 86.6]
angles = [-30, 270]

[[view]]
name = "sky_up"
position = [-295.3, 1078.7, 86.6]
angles = [-85, 0]

# Floor overlays on displacement terrain (dirt marks).
[[view]]
name = "floor_ct"
position = [-421.0, 2050.0, 60.0]
angles = [55, 90]

[[view]]
name = "floor_mid"
position = [-416.0, 1110.0, 40.0]
angles = [55, 90]

# Crates with detail textures (de_dust/dumltrycrsd2), B site.
[[view]]
name = "crates_b"
position = [-1100.0, 2234.0, 90.0]
angles = [10, 180]

# A lamp glow (env_sprite, sprites/glow.vmt, render mode 9).
[[view]]
name = "glow_lamp"
position = [-1406.0, 1050.0, 100.0]
angles = [-55, 90]

# Dust motes (func_dustmotes) inside long doors.
[[view]]
name = "dust_long_doors"
position = [600.0, 380.0, 20.0]
angles = [0, 70]

# The same lamp with its glow's centre above the view: the glow must stay.
[[view]]
name = "glow_lamp_down"
position = [-1406.0, 1050.0, 100.0]
angles = [-10, 90]

# Long A from the pit: props and overlays fade into the fog with the world.
[[view]]
name = "fog_long_a"
position = [1300.0, 400.0, 70.0]
angles = [5, 90]

# From CT spawn towards B: crates and boxes at fog distance next to walls.
[[view]]
name = "fog_ct_spawn"
position = [-421.0, 2050.0, 60.0]
angles = [5, 180]

[[view]]
name = "fog_ct_spawn_mid"
position = [-421.0, 2050.0, 60.0]
angles = [5, -90]

# An alpha-tested plastic crate (prop_physics) on long A.
[[view]]
name = "plastic_crate"
position = [1320.0, 1260.0, 50.0]
angles = [25, 90]

# Inside solid near the lower tunnels: CS:S clears to black, no sky.
[[view]]
name = "in_solid"
position = [-1406.0, 900.0, 150.0]
angles = [0, 90]
